<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AI Fact Checker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .header h2 {
      font-size: 16px;
      color: #38bdf8;
      font-weight: 700;
    }
    .status-badge {
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 4px;
      background: #22c55e;
      color: #052e16;
      font-weight: 700;
    }
    .status-offline {
      background: #ef4444;
      color: #450a0a;
    }
    .desc {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    textarea {
      width: 100%;
      height: 60px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #fff;
      padding: 10px;
      font-size: 13px;
      resize: none;
      font-family: inherit;
    }
    textarea:focus {
      outline: none;
      border-color: #38bdf8;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.15);
    }
    button {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      background: linear-gradient(135deg, #0284c7, #0ea5e9);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #result {
      margin-top: 14px;
      max-height: 260px;
      overflow-y: auto;
    }
    .loading {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #94a3b8;
      font-size: 12px;
      padding: 8px 0;
    }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.15);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .claim-result {
      background: #1e293b;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
      border: 1px solid #334155;
    }
    .verdict-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .verdict-badge {
      padding: 3px 10px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .verdict-true { background: #10b981; color: #052e16; }
    .verdict-false { background: #ef4444; color: #450a0a; }
    .verdict-misleading { background: #f59e0b; color: #78350f; }
    .verdict-unverified { background: #64748b; color: #0f172a; }
    .confidence-label {
      font-size: 11px;
      color: #94a3b8;
      font-weight: 500;
    }
    .claim-text {
      font-size: 12px;
      color: #cbd5e1;
      font-style: italic;
      margin-bottom: 6px;
      line-height: 1.4;
    }
    .reasoning {
      font-size: 12px;
      color: #e2e8f0;
      line-height: 1.5;
    }
    .source-count {
      font-size: 11px;
      color: #64748b;
      margin-top: 6px;
    }
    .error-msg {
      color: #f87171;
      font-size: 12px;
      padding: 8px 0;
    }
    .no-result {
      color: #94a3b8;
      font-size: 12px;
      padding: 8px 0;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>AI Fact Checker</h2>
    <span id="status" class="status-badge">...</span>
  </div>
  <p class="desc">Highlight text on any page and right-click → "Fact Check", or type a claim below:</p>
  <textarea id="claimInput" placeholder="Enter a claim to verify..."></textarea>
  <button id="checkBtn">Check Claim</button>
  <div id="result"></div>
  <script src="popup.js"></script>
</body>
</html>
